name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    name: typecheck + lint + build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-srs-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: english-srs-mvp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
